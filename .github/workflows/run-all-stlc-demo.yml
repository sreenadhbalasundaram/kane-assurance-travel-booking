name: "Kane CLI Assurance - Full STLC Demo"

on:
  workflow_dispatch:
    inputs:
      phases:
        description: Phase to run
        required: true
        default: all
        type: choice
        options: [all, '1', '2', '3', '4', '5', '6', '7']
      source_file:
        description: PRD file path
        required: true
        default: docs/prd-travel-booking.md
      source_id:
        description: Source ID
        required: true
        default: prd-travel-booking
      app_url:
        description: App URL, or skip to skip browser phases
        required: true
        default: https://my-testing-repo-main.vercel.app/travel-clone-app
      max_tests:
        description: Maximum scenario/test pairs per use-case
        required: true
        default: '3'
      project_id:
        description: Test Manager project ID
        required: true
      folder_id:
        description: Test Manager folder ID
        required: true
      target_usecase:
        description: Optional single use-case, for example uc-1
        required: false
        default: ''
      v2_prd:
        description: Updated PRD for maintenance
        required: true
        default: docs/prd-travel-booking-v2.md
      test_match:
        description: Regex selecting the three-test browser demo slice (use .* for all candidates)
        required: true
        default: 'homes-remain|selected-homes|reserve-navigates'

permissions:
  contents: read

concurrency:
  group: kane-assurance-${{ github.repository }}
  cancel-in-progress: false

env:
  KANE_CLI_USER_AGENT: codex
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
  PHASE: ${{ inputs.phases }}
  SOURCE_FILE: ${{ inputs.source_file }}
  SOURCE_ID: ${{ inputs.source_id }}
  APP_URL: ${{ inputs.app_url }}
  MAX_TESTS: ${{ inputs.max_tests }}
  PROJECT_ID: ${{ inputs.project_id }}
  FOLDER_ID: ${{ inputs.folder_id }}
  TARGET_USECASE: ${{ inputs.target_usecase }}
  V2_PRD: ${{ inputs.v2_prd }}
  TEST_MATCH: ${{ inputs.test_match }}

jobs:
  stlc-demo:
    name: STLC Demo - ${{ inputs.phases }}
    # Register this Apple Silicon Mac as a repository self-hosted runner.
    # Start ./run.sh interactively to display Chrome on the desktop.
    runs-on: [self-hosted, macOS, ARM64, kane-stlc-demo]
    timeout-minutes: 120
    defaults:
      run:
        # Compatible with macOS Bash 3.2; no mapfile dependency.
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify prerequisites
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          for tool in node npm jq kane-cli; do
            command -v "$tool" >/dev/null || { echo "::error::Missing $tool"; exit 1; }
          done
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          node --version
          jq --version
          kane-cli --version
          test -n "$LT_USERNAME" && test -n "$LT_ACCESS_KEY" || {
            echo "::error::Set repository secrets LT_USERNAME and LT_ACCESS_KEY"; exit 1;
          }
          test -n "$PROJECT_ID" && test -n "$FOLDER_ID"
          [[ "$MAX_TESTS" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::max_tests must be a positive integer"; exit 1;
          }
          if [[ "$PHASE" = all || "$PHASE" = 4 || "$PHASE" = 5 ]] && [ "$APP_URL" != skip ]; then
            test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || {
              echo "::error::Install Google Chrome in /Applications"; exit 1;
            }
          fi

      - name: Authenticate and configure destination
        run: |
          kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          kane-cli config project "$PROJECT_ID"
          kane-cli config folder "$FOLDER_ID"

      - name: Phase 1 - Ingest and extract requirements
        if: inputs.phases == 'all' || inputs.phases == '1'
        run: |
          test -f "$SOURCE_FILE" || { echo "::error::PRD file not found"; exit 1; }
          kane-cli context ingest "./$SOURCE_FILE" --as "$SOURCE_ID" --mode ci
          # Preserve the existing demo's override policy. Never retry a paid
          # turn blindly, or resume an arbitrary session from a global list.
          rc=0
          kane-cli context extract --source "$SOURCE_ID" --mode override || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::Extraction paused. Inspect context sessions and resolve the reported session before continuing."
          fi
          exit "$rc"

      - name: Phase 2 - Review requirements
        if: inputs.phases == 'all' || inputs.phases == '2'
        run: |
          kane-cli context list --json --inferred > review-items.json
          # Retains the supplied demo's automatic approval policy.
          jq -s '[.[] | select(.trust == "derived") | {ref: (.ref // .id // .slug // .name), resolution: "approved"}]' review-items.json > verdicts.json
          if [ "$(jq length verdicts.json)" -gt 0 ]; then
            kane-cli context review --verdicts verdicts.json --json
          fi
          kane-cli cover gaps

      - name: Phase 3 - Design tests
        if: inputs.phases == 'all' || inputs.phases == '3'
        timeout-minutes: 60
        run: |
          kane-cli context list --type usecase --json > graph.json
          jq -s -r '.[] | (.ref // .id // .slug // empty)' graph.json > usecases.txt
          test -s usecases.txt || { echo "::error::No use-cases. Complete phases 1 and 2 first."; exit 1; }
          if [ -n "$TARGET_USECASE" ]; then
            grep -Fx -- "$TARGET_USECASE" usecases.txt > selected-usecases.txt || {
              echo "::error::Requested use-case was not found"; exit 1;
            }
          else
            cp usecases.txt selected-usecases.txt
          fi
          failed=0
          while IFS= read -r uc; do
            kane-cli cover gaps "$uc" --json > design-status.json
            if jq -e --arg uc "$uc" '.usecases[] | select(.id == $uc) | select(.design_completeness.status == "complete" and .stale_acs == 0)' design-status.json >/dev/null; then
              echo "Reusing complete, current design for $uc"
              continue
            fi
            rc=0
            kane-cli design tests --use-case "$uc" --mode override --max "$MAX_TESTS" --allow-unreviewed || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::Design did not complete for $uc (exit $rc). Inspect its reported refusal or paused session; no automatic redesign was attempted."
              failed=1
              break
            fi
          done < selected-usecases.txt
          exit "$failed"

      - name: Phase 3 - Review designed tests
        if: inputs.phases == 'all' || inputs.phases == '3'
        run: |
          kane-cli context list --json --inferred > review-items.json
          jq -s '[.[] | select(.trust == "derived") | {ref: (.ref // .id // .slug // .name), resolution: "approved"}]' review-items.json > verdicts.json
          if [ "$(jq length verdicts.json)" -gt 0 ]; then
            kane-cli context review --verdicts verdicts.json --json
          fi
          test -d .testmuai/tests
          find .testmuai/tests -name '*_test.md' -print
          echo "Fill required variables locally before browser execution; values are never printed here."

      - name: Prepare public demo fixtures
        if: (inputs.phases == 'all' || inputs.phases == '3' || inputs.phases == '4' || inputs.phases == '5')
        run: node scripts/prepare-demo-variables.cjs

      - name: Phase 4 - Author demo tests
        if: (inputs.phases == 'all' || inputs.phases == '4') && inputs.app_url != 'skip'
        timeout-minutes: 30
        run: |
          test -d .testmuai/tests || { echo "::error::Complete phase 3 first"; exit 1; }
          find .testmuai/tests -name '*_test.md' -print | sort > available-tests.txt
          grep -E -- "$TEST_MATCH" available-tests.txt | head -n 3 > selected-tests.txt
          test -s selected-tests.txt || { echo "::error::No tests to author"; exit 1; }
          # Start at the required mobile width; the browser agent cannot resize
          # its viewport reliably from a natural-language step in CLI 0.8.20.
          kane-cli config set-window 320x1080
          failed=0
          while IFS= read -r test_file; do
            rc=0
            kane-cli testmd run "$test_file" --url "$APP_URL" --agent || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::Authoring did not pass (exit $rc); inspect the CLI diagnostics above."
              failed=1
            fi
          done < selected-tests.txt
          exit "$failed"

      - name: Phase 5 - Execute demo tests
        if: (inputs.phases == 'all' || inputs.phases == '5') && inputs.app_url != 'skip'
        timeout-minutes: 30
        run: |
          test -d .testmuai/tests || { echo "::error::Complete phase 3 first"; exit 1; }
          # Use the same deterministic three-test demo slice as authoring.
          find .testmuai/tests -name '*_test.md' -print | sort > available-tests.txt
          grep -E -- "$TEST_MATCH" available-tests.txt | head -n 3 > selected-tests.txt
          tests=()
          while IFS= read -r test_file; do tests+=("$test_file"); done < selected-tests.txt
          [ "${#tests[@]}" -gt 0 ] || { echo "::error::No tests selected"; exit 1; }
          # Existing test frontmatter URLs override this configured fallback.
          kane-cli config set-url "$APP_URL"
          kane-cli config set-window 320x1080
          kane-cli testrun run "${tests[@]}" < /dev/null

      - name: Phase 6 - Coverage and reporting
        if: inputs.phases == 'all' || inputs.phases == '6'
        run: |
          kane-cli cover --json > coverage.json
          kane-cli cover gaps --json > coverage-gaps.json
          jq -e . coverage.json >/dev/null
          jq -e . coverage-gaps.json >/dev/null

      - name: Phase 7 - Reconcile PRD change
        if: inputs.phases == 'all' || inputs.phases == '7'
        timeout-minutes: 15
        run: |
          test -f "$V2_PRD" || { echo "::error::Updated PRD not found"; exit 1; }
          rc=0
          kane-cli maintain reconcile --from "./$V2_PRD" --source-id "$SOURCE_ID" --mode override || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::Maintenance paused for a decision. Follow the CLI's reported resume instructions."
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          kane-cli cover gaps

      - name: Generate context graph
        if: always()
        run: |
          if [ -d .context ]; then
            kane-cli context view --out context-graph.html --no-open
          fi

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "# StayNest STLC demo"
            echo "Phase: $PHASE"
            echo "Job status before summary: $JOB_STATUS"
            echo "Test Manager: https://test-manager.lambdatest.com/projects/$PROJECT_ID/test-runs"
            echo "The local context and tests persist on this runner."
          } | tee test-manager-links.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stlc-phase-${{ inputs.phases }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          # Do not upload variable pools or the whole runtime directory.
          path: |
            coverage.json
            coverage-gaps.json
            context-graph.html
            test-manager-links.md
