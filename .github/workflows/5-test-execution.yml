name: "5 - Test Execution"

#
# STLC Phase: Test Execution
# Kane CLI:   testrun run + HyperExecute
#
# What it demonstrates:
#   - Batch replay of authored tests (fast, no AI needed)
#   - Execution on HyperExecute cloud grid
#   - Sealed evidence packs per test
#   - Every run is linked to the context graph
#
# What the prospect should notice:
#   - Tests replay without the AI agent (deterministic)
#   - Evidence packs are sealed and timestamped
#   - Same tests, multiple environments
#
# Prerequisites:
#   Run workflows 1-4 first, and have the app deployed
#

on:
  workflow_dispatch:
    inputs:
      development_run_id:
        description: 'Workflow 4 run ID containing the authored test artifact'
        required: true
      app_url:
        description: 'URL of the StayNest app to test against'
        required: true
        default: 'https://my-testing-repo-main.vercel.app/travel-clone-app'
      match_pattern:
        description: 'Test name pattern to match (e.g., t- for all designed tests)'
        required: true
        default: 't-'
      execution_target:
        description: 'Where to run: local or hyperexecute'
        required: true
        default: 'local'
        type: choice
        options: [local, hyperexecute]
      project_id:
        description: 'Test Manager project ID containing the authored cases'
        required: true
      folder_id:
        description: 'Test Manager folder ID used when cases were authored'
        required: true

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

permissions:
  actions: read
  contents: read

jobs:
  test-execution:
    name: Execute Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli && kane-cli --version

      - name: Install HyperExecute integration
        run: kane-cli plugin install remote-execution


      - name: Authenticate
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: Configure Test Manager destination
        shell: bash
        env:
          KANE_PROJECT_ID: ${{ inputs.project_id }}
          KANE_FOLDER_ID: ${{ inputs.folder_id }}
        run: |
          if [ -z "$KANE_PROJECT_ID" ] || [ -z "$KANE_FOLDER_ID" ]; then
            echo "::error::project_id and folder_id are required"
            exit 1
          fi
          kane-cli config project "$KANE_PROJECT_ID"
          kane-cli config folder "$KANE_FOLDER_ID"
          echo "Test Manager project: https://test-manager.lambdatest.com/projects/$KANE_PROJECT_ID"
          echo "Replay evidence is published to the project of the authored test cases."

      - name: Install Google Chrome
        if: inputs.execution_target == 'local'
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y

      - name: Restore context graph, tests, and evidence
        uses: actions/cache@v4
        with:
          path: |
            .context/
            .testmuai/
          key: context-tests-${{ hashFiles('docs/**') }}-${{ github.run_id }}
          restore-keys: |
            context-tests-${{ hashFiles('docs/**') }}-

      - name: Normalize development run ID
        id: normalized-development-run
        shell: bash
        env:
          RAW_DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
        run: |
          DEVELOPMENT_RUN_ID="$(printf '%s' "$RAW_DEVELOPMENT_RUN_ID" | tr -d '[:space:]')"
          if ! [[ "$DEVELOPMENT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::development_run_id must contain only digits"
            exit 1
          fi
          echo "run_id=$DEVELOPMENT_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download authored tests from Workflow 4
        uses: actions/download-artifact@v4
        with:
          name: 4-test-development-${{ steps.normalized-development-run.outputs.run_id }}
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.normalized-development-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize StayNest route placeholders
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          BASE_URL="${APP_URL%/}"
          while IFS= read -r -d '' TEST_FILE; do
            sed -i \
              -e "s|{{valid_listing_url}}|${BASE_URL}/rooms/ns1|g" \
              -e "s|{{invalid_listing_url}}|${BASE_URL}/rooms/not-a-real-listing|g" \
              -e 's|{listing_id}|{{listing_id}}|g' \
              -e 's|{listingId}|ns1|g' \
              "$TEST_FILE"
          done < <(find .testmuai/tests -type f -name '*_test.md' -print0)
      - name: Configure StayNest test variables
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          BASE_URL="${APP_URL%/}"
          mkdir -p .testmuai/variables
          printf '{"valid_listing_url":{"value":"%s/rooms/ns1"},"invalid_listing_url":{"value":"%s/rooms/not-a-real-listing"}}\n' \
            "$BASE_URL" "$BASE_URL" > .testmuai/variables/staynest-demo.json
      - name: Configure application URL
        run: kane-cli config set-url "${{ inputs.app_url }}"
      #  EXECUTE
      - name: Mark execution start
        id: execution-clock
        shell: bash
        run: echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: "Execute: Batch replay of authored tests (local)"
        if: inputs.execution_target == 'local'
        run: |
          echo ""
          echo "  Test execution  local"
          echo "  App URL: ${{ inputs.app_url }}"
          echo "  Pattern: ${{ inputs.match_pattern }}"
          echo ""
          echo ""
          set +e
          kane-cli testrun run \
            --match "${{ inputs.match_pattern }}" \
            --headless 2>&1 | tee testrun-output.ndjson
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: "Execute: Run on HyperExecute cloud grid"
        if: inputs.execution_target == 'hyperexecute'
        run: |
          echo ""
          echo "  Test execution  HyperExecute"
          echo "  App URL: ${{ inputs.app_url }}"
          echo "  Pattern: ${{ inputs.match_pattern }}"
          echo ""
          echo ""
          set +e
          kane-cli testrun run \
            --match "${{ inputs.match_pattern }}" \
            --remote hyper 2>&1 | tee testrun-output.ndjson
          status=${PIPESTATUS[0]}
          exit "$status"
      #  RESULTS
      - name: "Result: List evidence packs"
        if: always()
        run: |
          echo ""
          echo ""
          echo "  Evidence packs from this run"
          echo ""
          if [ -d ".testmuai/evidence" ]; then
            ls -la .testmuai/evidence/ 2>/dev/null || echo "No evidence directory"
            echo ""
            echo "Total packs: $(find .testmuai/evidence -maxdepth 1 -type d | wc -l | tr -d ' ')"
          else
            echo "No evidence packs found"
          fi

      - name: "Result: Publish Test Manager links"
        if: always()
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          PROJECT_URL="https://test-manager.lambdatest.com/projects/$PROJECT_ID"
          RUNS_URL="$PROJECT_URL/test-runs"
          EVIDENCE_ID=""
          HYPER_URL=""
          TEST_MANAGER_RUN_ID=""
          TEST_MANAGER_RUN_URL=""
          TEST_MANAGER_EVIDENCE_URL=""

          if [ -f testrun-output.ndjson ]; then
            EVIDENCE_ID=$(jq -r 'select(.type == "testrun_evidence_ingest") | .evidence_id // empty' testrun-output.ndjson 2>/dev/null | tail -1)
            HYPER_URL=$(jq -r 'select(.type == "testrun_summary") | .remote.jobUrl // empty' testrun-output.ndjson 2>/dev/null | tail -1)
          fi

          # testrun emits the evidence ID but not the Test Manager batch-run ID.
          # The official Test Manager API lets us resolve the newest run created
          # during this job, so the generated link points to the actual run.
          TMS_RUNS_API="https://test-manager-api.lambdatest.com/api/v1/projects/$PROJECT_ID/test-runs?per_page=100"
          if [ -n "$EVIDENCE_ID" ] && curl --fail --silent --show-error --retry 2 \
              --user "$LT_USERNAME:$LT_ACCESS_KEY" \
              "$TMS_RUNS_API" -o test-manager-runs.json 2>test-manager-api-error.log; then
            STARTED_AT="${{ steps.execution-clock.outputs.started_at }}"
            TEST_MANAGER_RUN_ID=$(jq -r --argjson started "$STARTED_AT" '
              [.data[]? | select(.created_at != null) |
               . + {created_epoch: (.created_at | fromdateiso8601)} |
               select(.created_epoch >= $started)] |
              sort_by(.created_epoch) | last | .id // empty
            ' test-manager-runs.json 2>/dev/null)
          else
            echo "Test Manager run lookup failed; see test-manager-api-error.log in the artifact."
          fi

          if [ -n "$TEST_MANAGER_RUN_ID" ]; then
            TEST_MANAGER_RUN_URL="$PROJECT_URL/test-run/$TEST_MANAGER_RUN_ID"
            if [ -n "$EVIDENCE_ID" ]; then
              TEST_MANAGER_EVIDENCE_URL="$TEST_MANAGER_RUN_URL/evidence?evidenceId=$EVIDENCE_ID"
            fi
          fi

          {
            echo "# StayNest test execution links"
            echo ""
            echo "- Test Manager project: $PROJECT_URL"
            echo "- Test Manager test runs: $RUNS_URL"
            if [ -n "$TEST_MANAGER_RUN_URL" ]; then
              echo "- Test Manager run: $TEST_MANAGER_RUN_URL"
            fi
            if [ -n "$TEST_MANAGER_EVIDENCE_URL" ]; then
              echo "- Test Manager evidence: $TEST_MANAGER_EVIDENCE_URL"
            fi
            if [ -n "$EVIDENCE_ID" ]; then
              echo "- Evidence ID: $EVIDENCE_ID"
            fi
            if [ -n "$HYPER_URL" ]; then
              echo "- HyperExecute job: $HYPER_URL"
            fi
            echo ""
            if [ -z "$TEST_MANAGER_RUN_URL" ]; then
              echo "The Test Manager run ID could not be resolved automatically. Open the test-runs link above to access the generated run."
            else
              echo "The evidence link uses the evidence ID returned by Kane CLI; Test Manager may append a time-limited signed pack URL when opened."
            fi
            echo ""
            echo "## Authored test cases"
            found=0
            for result in .testmuai/evidence/*/result.yaml; do
              [ -f "$result" ] || continue
              testcase_id=$(awk '$1 == "testcase_id:" {print $2; exit}' "$result")
              [ -n "$testcase_id" ] || continue
              testcase_url="$PROJECT_URL/test-cases/$testcase_id"
              echo "- [$testcase_id]($testcase_url)"
              found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "- No test-case IDs were found in the local evidence packs."
            fi
          } | tee test-manager-links.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5-test-execution-${{ github.run_id }}
          retention-days: 30
          include-hidden-files: true
          path: |
            .testmuai/evidence/
            .context/
            testrun-output.ndjson
            test-manager-runs.json
            test-manager-api-error.log
            test-manager-links.md

