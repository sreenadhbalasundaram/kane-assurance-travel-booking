# STLC Phase: Maintenance
# Kane CLI:   maintain reconcile + maintain evolve
#
# What it demonstrates:
#   - PRD changed ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ system detects the diff automatically
#   - Changeset shows ADD, MODIFY, ARCHIVE with blast radius
#   - Stale use-cases are flagged and re-designed
#   - The test suite evolves with requirements, not by hand
#
# What the prospect should notice:
#   - Test rot is STRUCTURALLY IMPOSSIBLE
#   - Nobody manually updates tests when requirements change
#   - The system tells you what changed and what to do
#   - Every decision is auditable and reversible
#
# Demo flow:
#   1. Run workflows 1-6 with prd-travel-booking.md (v1)
#   2. Trigger this workflow with prd-travel-booking-v2.md
#   3. Watch the changeset: Apple Pay added, Save for Later added
#   4. See stale markers on affected use-cases
#   5. Run workflow 6 again ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚ gaps appear for the new requirements
#
# Prerequisites:
#   Run workflows 1-3 at minimum, to have a context graph
