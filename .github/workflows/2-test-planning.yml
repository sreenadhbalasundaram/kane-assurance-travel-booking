      - name: "Review: Approve extracted use-cases"
        if: inputs.review_mode == 'approve-all'
        run: |
          echo "ÃƒÆ’Ã‚Â¢Ãƒâ€¦Ã¢â‚¬Å“ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦ Auto-approving all extracted use-cases"

          # Get all items from the context graph
          kane-cli context list --json > /tmp/all-items.json 2>/dev/null || echo "[]" > /tmp/all-items.json

          echo "All items in graph:"
          cat /tmp/all-items.json | jq '.' 2>/dev/null || cat /tmp/all-items.json

          # Build verdicts: approve everything that has a ref field
          jq '[.[] | select(.ref != null) | {ref: .ref, resolution: "approved"}]' /tmp/all-items.json > /tmp/verdicts.json 2>/dev/null || echo "[]" > /tmp/verdicts.json

          ITEM_COUNT=$(jq 'length' /tmp/verdicts.json 2>/dev/null || echo "0")

          if [ "$ITEM_COUNT" -gt "0" ]; then
            echo ""
            echo "Approving $ITEM_COUNT items..."
            cat /tmp/verdicts.json | jq '.'
            echo ""
            kane-cli context review --verdicts /tmp/verdicts.json || echo "Review completed (some items may already be approved)"
          else
            echo "No items found to approve"
          fi

      - name: "Review: Apply verdicts from file"
        if: inputs.review_mode == 'manual'
        run: |
          if [ -f "docs/verdicts.json" ]; then
            echo "ÃƒÆ’Ã‚Â°Ãƒâ€¦Ã‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã…â€œÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¹ Applying verdicts from docs/verdicts.json"
            kane-cli context review --verdicts docs/verdicts.json
          else
            echo "ÃƒÆ’Ã‚Â¢Ãƒâ€¦Ã‚Â¡Ãƒâ€šÃ‚Â ÃƒÆ’Ã‚Â¯Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚  No docs/verdicts.json found"
            echo "   Create one with format:"
            echo '   [{"ref": "uc-xxx", "resolution": "approved"}]'
            exit 1
          fi

