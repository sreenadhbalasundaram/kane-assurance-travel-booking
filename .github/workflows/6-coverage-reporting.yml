# STLC Phase: Coverage & Reporting
# Kane CLI:   cover + cover gaps
#
# What it demonstrates:
#   - Two-axis coverage: depth (proven) + completeness (owed)
#   - The ribbon view showing every use-case's status
#   - Risk-ranked gaps with fix commands
#   - Per use-case dossier with full AC breakdown
#
# What the prospect should notice:
#   - Coverage is about REQUIREMENTS, not code lines
#   - Two questions answered: "what passed?" AND "what's missing?"
#   - Debt tags show exactly what needs attention
#
# This is the MONEY SLIDE in a demo. Lead with this.
#
# Prerequisites:
#   Run workflows 1-5 for full coverage, or 1-3 for design-only
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

on:
  workflow_dispatch:
    inputs:
      use_case:
        description: 'Specific use-case for detailed dossier (blank = show ribbon)'
        required: false
        default: ''
      top_gaps:
        description: 'Number of top gaps to show'
        required: true
        default: '10'

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli && kane-cli --version

      - name: Authenticate
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: Restore context graph and evidence
        uses: actions/cache@v4
        with:
          path: |
            .context/
            .testmuai/
          key: context-tests-${{ hashFiles('docs/**') }}-${{ github.run_number }}
          restore-keys: |
            context-tests-${{ hashFiles('docs/**') }}-

      # â”€â”€ COVERAGE PANEL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
