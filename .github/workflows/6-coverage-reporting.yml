        run: |
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo "  Coverage report"
          echo "  Depth  = what did the last run prove?"
          echo "  Compl. = what does the design still owe?"
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo ""
          kane-cli cover 2>/dev/null || echo "No evidence packs yet â€” run workflow 5 first"

      # â”€â”€ RIBBON VIEW â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: "Ribbon: Bird's-eye project coverage"
        run: |
          echo ""
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo "  Coverage ribbon â€” all use-cases"
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo ""
          kane-cli cover gaps 2>/dev/null || echo "Run workflows 1-3 first for design coverage"

      # â”€â”€ DOSSIER (optional) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: "Dossier: Detailed breakdown for one use-case"
        if: inputs.use_case != ''
        run: |
          echo ""
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo "  Dossier: ${{ inputs.use_case }}"
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo ""
          kane-cli cover gaps "${{ inputs.use_case }}" 2>/dev/null \
            || echo "Use-case not found or no coverage data"

      # â”€â”€ GAPS WORKLIST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: "Gaps: Top ${{ inputs.top_gaps }} by risk"
        run: |
          echo ""
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo "  Top ${{ inputs.top_gaps }} gaps â€” ranked by risk"
          echo "â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”"
          echo ""
          kane-cli cover gaps \
            --top ${{ inputs.top_gaps }} \
            2>/dev/null || echo "No gaps"

      # â”€â”€ SAVE JSON â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Save machine-readable outputs
        run: |
          kane-cli cover --json > coverage.json 2>/dev/null || echo "{}" > coverage.json
          kane-cli cover gaps --json > coverage-gaps.json 2>/dev/null || echo "[]" > coverage-gaps.json
          kane-cli cover gaps --stage design --json > design-gaps.json 2>/dev/null || echo "[]" > design-gaps.json
          kane-cli cover gaps --stage cover --json > execution-gaps.json 2>/dev/null || echo "[]" > execution-gaps.json

      - name: Generate visual graph
        run: kane-cli context view --output context-graph.html 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 6-coverage-report-${{ github.run_number }}
          retention-days: 30
          path: |
            coverage.json
            coverage-gaps.json
            design-gaps.json
            execution-gaps.json
            context-graph.html

